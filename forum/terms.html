<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>使用条款 - Jacky 论坛</title>
	<meta name="robots" content="noindex">
	<link rel="icon" type="image/png" href="icon.svg">
	<style>
		:root {
			--bg: #f6f6f6;
			--card: #fff;
			--text: #1a1a1a;
			--sub: #666;
			--border: #e3e3e3;
			--green: #0a0;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #111;
				--card: #1c1c1c;
				--text: #eee;
				--sub: #aaa;
				--border: #333;
				--green: #3d8c40;
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 24px 16px 64px;
			background: var(--bg);
			color: var(--text);
			font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
				"Hiragino Sans GB", "Microsoft YaHei", sans-serif;
		}

		.wrap {
			max-width: 760px;
			margin: 0 auto;
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 20px;
			padding: 32px 36px 40px;
		}

		.topbar {
			max-width: 760px;
			margin: 0 auto 14px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 14px;
			color: var(--sub);
		}

		.topbar a {
			color: var(--green);
			text-decoration: none;
		}

		h1 {
			font-size: 26px;
			margin: 0 0 8px;
			line-height: 1.3;
		}

		h2 {
			font-size: 19px;
			margin: 32px 0 10px;
			padding-top: 4px;
		}

		h3 {
			font-size: 16px;
			margin: 22px 0 8px;
		}

		p {
			margin: 10px 0;
			color: var(--text);
		}

		ul {
			margin: 8px 0 12px;
			padding-left: 22px;
		}

		li {
			margin: 6px 0;
		}

		hr {
			border: 0;
			border-top: 1px solid var(--border);
			margin: 28px 0;
		}

		strong {
			font-weight: 650;
		}

		code {
			background: rgba(127, 127, 127, .14);
			padding: 1px 6px;
			border-radius: 6px;
			font-size: .92em;
		}

		a {
			color: var(--green);
		}

		.loading {
			color: var(--sub);
		}

		@media (max-width: 600px) {
			body {
				padding: 12px 10px 40px;
			}

			.wrap {
				padding: 22px 18px 28px;
				border-radius: 16px;
			}

			h1 {
				font-size: 22px;
			}
		}
	</style>
</head>

<body>
	<div class="topbar">
		<a href="./">← 返回 Jacky 论坛</a>
	</div>
	<main class="wrap loading" id="doc">加载中…</main>

	<script>
		(function () {
			function esc(s) {
				return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
			}
			function inline(s) {
				s = esc(s);
				s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
				s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
				s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
				return s;
			}
			function render(md) {
				var lines = md.split(/\r?\n/), out = [], list = null;
				function closeList() {
					if (list) { out.push("</" + list + ">"); list = null; }
				}
				for (var i = 0; i < lines.length; i++) {
					var line = lines[i].trim();
					if (!line) { closeList(); continue; }
					if (line === "---") { closeList(); out.push("<hr>"); continue; }
					var m = line.match(/^(#{1,4})\s+(.*)$/);
					if (m) {
						closeList();
						var lv = m[1].length;
						out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">");
						continue;
					}
					m = line.match(/^[-*]\s+(.*)$/);
					if (m) {
						if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
						out.push("<li>" + inline(m[1]) + "</li>");
						continue;
					}
					closeList();
					out.push("<p>" + inline(line) + "</p>");
				}
				closeList();
				return out.join("\n");
			}

			var el = document.getElementById("doc");
			fetch("terms.md", { cache: "no-cache" })
				.then(function (r) {
					if (!r.ok) throw new Error("HTTP " + r.status);
					return r.text();
				})
				.then(function (md) {
					el.innerHTML = render(md);
					el.classList.remove("loading");
					document.title = "使用条款 - Jacky 论坛";
				})
				.catch(function () {
					el.classList.remove("loading");
					el.innerHTML = '<p>条款加载失败，请 <a href="terms.md">直接查看原文</a>，或稍后重试。</p>';
				});
		})();
	</script>
</body>

</html>
