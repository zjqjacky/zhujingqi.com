

<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<title>Jacky Chat - Zhujingqi</title>
		<link rel="icon" type="image/png" href="icon.svg">
		<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
		<link rel="apple-touch-icon" sizes="120x120" href="icon.png">
		<style>
			:root {
				--bg: #eee;
				--card: #fff;
				--text: #111;
				--sub: #666;
				--green: #0a0;
				--active: #0a0;
				--line: #ddd;
				--mine: #b7f1d9;
				--other: #fff;
				--shadow: 0 8px 20px rgba(0, 0, 0, .12);
				--top-h: 64px;
				font-size: 18px;
			}

			body.dark {
				--bg: #111;
				--card: #222;
				--text: #eee;
				--sub: #aaa;
				--green: #0a0;
				--active: #0a0;
				--line: #444;
				--mine: #173117;
				--other: #2a2a2a;
				--shadow: 0 8px 20px rgba(0, 0, 0, .35);
			}

			button,
			.btn,
			.item {
				user-select: none;
				-webkit-user-select: none;
			}

			.loadingText {
				display: flex;
				align-items: center;
				gap: 2px;
				font-size: 18px;
				font-weight: bold;
				color: var(--text);
			}

			.dot {
				display: inline-block;
				animation: dotJump 1s infinite;
			}

			.dot1 {
				animation-delay: 0s;
			}

			.dot2 {
				animation-delay: 0.15s;
			}

			.dot3 {
				animation-delay: 0.3s;
			}

			@keyframes dotJump {

				0%,
				80%,
				100% {
					transform: translateY(0);
					opacity: 0.5;
				}

				40% {
					transform: translateY(-6px);
					opacity: 1;
				}
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
			}

			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				overflow: hidden;
			}

			body::-webkit-scrollbar,
			::-webkit-scrollbar {
				width: 10px;
				background: transparent;
			}

			body::-webkit-scrollbar-thumb,
			::-webkit-scrollbar-thumb {
				background-color: #aaa;
				border-radius: 10px;
				border: 2px solid transparent;
				background-clip: content-box;
			}

			body.dark::-webkit-scrollbar-thumb {
				background-color: #333;
			}

			a {
				color: var(--green);
			}

			button {
				border: 0;
				padding: 0 12px;
				border-radius: 20px;
				cursor: pointer;
				background: var(--card);
				color: var(--text);
				transition: .2s;
				box-sizing: border-box;
				height: 42px;
				font-size: 18px;
			}

			button:hover {
				background: var(--green);
				color: #fff;
			}

			input,
			textarea {
				width: 100%;
				padding: 12px;
				margin: 6px 0;
				border-radius: 20px;
				border: 1px solid var(--line);
				background: var(--card);
				color: var(--text);
				box-sizing: border-box;
				height: 42px;
				font-size: 18px;
				overflow: auto;
				outline: none;
			}

			input:focus {
				border: 2px solid var(--text);
			}

			textarea {
				height: 120px;
				resize: none;
			}

			.hidden {
				display: none !important;
			}

			.popup {
				opacity: 1;
				visibility: visible;
				pointer-events: auto;
				transition: opacity 0.25s ease, visibility 0.25s ease, transform 0.25s ease;
			}
			.popup.closed {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			.center {
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				padding: 20px;
			}

			.card {
				background: var(--card);
				padding: 28px;
				border-radius: 20px;
				box-shadow: var(--shadow);
				width: 100%;
				max-width: 360px;
				display: flex;
				flex-direction: column;
			}

			.big {
				font-size: 36px;
				font-weight: bold;
				margin-bottom: 18px;
				text-align: center;
				color: var(--text);
			}

			.muted {
				color: var(--sub);
				font-size: 13px;
				line-height: 1.6;
				text-align: center;
			}

			.miniBtn {
				height: 38px;
				padding: 0 14px;
				border-radius: 20px;
			}

			.helpBtn {
				width: 22px;
				height: 22px;
				border-radius: 50%;
				padding: 0;
				font-size: 14px;
				line-height: 22px;
				text-align: center;
			}

			.helpBtn:hover {
				background: #f0f0f0;
				color: var(--text);
			}

			#app {
				height: 100vh;
				display: flex;
				flex-direction: column;
				width: 100%;
				overflow: hidden;
			}

			.logo {
				font-size: 28px;
				font-weight: bold;
				color: var(--green);
				flex-shrink: 0;
				padding: 20px;
			}

			.content {
				flex: 1;
				min-height: 0;
				overflow: hidden;
			}

			.page {
				height: 100%;
				min-height: 0;
			}

			.chatWrap {
				display: grid;
				grid-template-columns: 320px 1fr;
				height: 100%;
				min-height: 0;
			}

			.leftPanel {
				border-right: 1px solid var(--line);
				background: var(--card);
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			.panelHead {
				padding: 15px;
				padding-top: 0px;
				border-bottom: 1px solid var(--line);
				display: grid;
				gap: 10px;
				flex-shrink: 0;
			}

			.list {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				padding: 8px;
			}

			.item {
				width: 100%;
				padding: 12px;
				border-radius: 20px;
				cursor: pointer;
				display: flex;
				justify-content: flex-start;
				align-items: center;
				gap: 10px;
				border: 1px solid transparent;
				margin-bottom: 8px;
				background: var(--card);
			}

			.item:hover {
				border-color: var(--green);
			}

			.item.active {
				background: var(--green);
				color: #fff;
			}

			.item.pinned {
				background: #e6f4ea;
			}

			.item.pinned.active {
				background: var(--green);
				color: #fff;
			}

			body.dark .item.pinned {
				background: #1e3a2a;
			}

			body.dark .item.pinned.active {
				background: var(--green);
				color: #fff;
			}

			.itemTitle {
				font-weight: bold;
			}

			.unreadDot {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 20px;
				height: 20px;
				padding: 0 6px;
				margin-left: 8px;
				border-radius: 999px;
				background: #ff7777;
				color: #fff;
				font-size: 12px;
				font-weight: 700;
				line-height: 20px;
				vertical-align: middle;
			}

			.itemSub {
				font-size: 12px;
				opacity: .8;
			}

			.chatPanel {
				min-width: 0;
				display: flex;
				flex-direction: column;
				min-height: 0;
			}

			.chatHead {
				height: var(--top-h);
				background: var(--card);
				border-bottom: 1px solid var(--line);
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				padding: 0 16px;
				flex-shrink: 0;
			}

			.meAvatar {
				width: 48px;
				height: 48px;
				border-radius: 50%;
				object-fit: cover;
				flex-shrink: 0;
				border: 1px solid rgba(0, 0, 0, .08);
				background: var(--bg);
				cursor: pointer;
				transition: transform .15s;
			}

			.meAvatar:hover {
				transform: scale(1.08);
			}

			.chatTitle {
				font-size: 20px;
				font-weight: 800;
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.mobileBack {
				display: none;
			}

			#refreshChatBtn {
				width: 36px;
				height: 36px;
				border-radius: 50%;
				font-size: 18px;
				cursor: pointer;
			}

			#quickSendBtn {
				width: 36px;
				height: 36px;
				border-radius: 50%;
				font-size: 18px;
				cursor: pointer;
			}

			.chatBody {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				padding: 16px;
				display: flex;
				flex-direction: column;
				gap: 10px;
			}

			.empty {
				margin: auto;
				color: var(--sub);
				text-align: center;
				line-height: 1.8;
			}

			.msgRow {
				width: 100%;
				display: flex;
				align-items: flex-start;
				padding: 0 8px;
				gap: 8px;
				box-sizing: border-box;
			}

			.msgRow.mine {
				justify-content: flex-end;
			}

			.msgRow.other {
				justify-content: flex-start;
			}

			.msgAvatar {
				width: 32px;
				height: 32px;
				border-radius: 50%;
				object-fit: cover;
				flex-shrink: 0;
				background: var(--bg);
				border: 1px solid rgba(0, 0, 0, .08);
				cursor: pointer;
				transition: transform .15s, box-shadow .15s;
			}

			.msgAvatar:hover {
				transform: scale(1.12);
				box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
			}

			.chatAvatar {
				cursor: pointer;
				transition: transform .15s, box-shadow .15s;
			}

			.chatAvatar:hover {
				transform: scale(1.1);
				box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
			}

			.msg {
				position: relative;
				display: flex;
				width: 100%;
				max-width: 100%;
			}

			.msg.mine {
				justify-content: flex-end;
			}

			.msg.other {
				justify-content: flex-start;
			}

			.bubble {
				display: block;
				width: auto;
				max-width: 560px;
				padding: 12px 14px;
				border-radius: 20px;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				word-break: break-word;
				box-shadow: 0 4px 12px rgba(0, 0, 0, .06);
			}

			.msg.mine .bubble {
				background: var(--mine);
				border: 1px solid var(--line);
				border-radius: 20px 2px 20px 20px;
			}

			.msg.other .bubble {
				background: var(--other);
				border: 1px solid var(--line);
				border-radius: 2px 20px 20px 20px;
			}

			.revokeBtn {
				position: static;
				background: rgba(255, 77, 79, .14);
				color: #e23a3a;
				border: 1px solid rgba(255, 77, 79, .25);
				border-radius: 50%;
				font-size: 12px;
				padding: 3px 10px;
				cursor: pointer;
				opacity: 0;
				pointer-events: none;
				transition: 0.2s;
				white-space: nowrap;
				flex-shrink: 0;
				margin-right: 4px;
				backdrop-filter: blur(4px);
				-webkit-backdrop-filter: blur(4px);
			}

			.msg.mine:hover .revokeBtn {
				opacity: 1;
				pointer-events: auto;
			}

			.replyCard {
				background: rgba(0, 0, 0, .04);
				border-left: 3px solid rgba(0, 0, 0, .15);
				border-radius: 4px;
				padding: 4px 8px;
				margin-bottom: 6px;
				font-size: 12px;
				color: #888;
				cursor: pointer;
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
				max-width: 360px;
				transition: background .15s;
			}

			.replyCard:hover {
				background: rgba(0, 0, 0, .08);
			}

			.replyPreview {
				display: none;
				align-items: center;
				gap: 8px;
				padding: 8px 12px;
				margin: 0 8px;
				background: var(--card);
				border: 1px solid var(--line);
				border-radius: 12px 12px 0 0;
				border-bottom: none;
				font-size: 12px;
				color: #888;
				position: relative;
			}

			.replyPreview.show {
				display: flex;
			}

			.replyPreview .rpText {
				flex: 1;
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis;
			}

			.replyPreview .rpClose {
				cursor: pointer;
				color: #999;
				font-size: 16px;
				flex-shrink: 0;
				padding: 0 2px;
			}

			.replyPreview .rpClose:hover {
				color: #333;
			}

			.quoteBtn {
				position: static;
				background: rgba(0, 0, 0, .06);
				color: var(--text);
				border: 1px solid rgba(0, 0, 0, .1);
				border-radius: 50%;
				font-size: 12px;
				padding: 3px 10px;
				cursor: pointer;
				opacity: 0;
				pointer-events: none;
				transition: 0.2s;
				white-space: nowrap;
				flex-shrink: 0;
				margin-left: 4px;
				backdrop-filter: blur(4px);
				-webkit-backdrop-filter: blur(4px);
			}

			.msg:hover .quoteBtn,
			.msg:hover .revokeBtn {
				opacity: 1;
				pointer-events: auto;
			}

			.replyHighlight {
				animation: replyFlash .8s ease;
			}

			@keyframes replyFlash {
				0%, 100% { box-shadow: 0 4px 12px rgba(0, 0, 0, .06); }
				30%, 70% { box-shadow: 0 0 0 3px rgba(0, 170, 255, .5); }
			}

			.bubble img {
				max-width: 100%;
				max-height: 300px;
				border-radius: 8px;
				display: block;
				margin: 4px 0;
				cursor: zoom-in;
			}

			.msgBar {
				position: relative;
				padding: 14px 14px 28px 14px;
				border-top: 1px solid var(--line);
				background: var(--card);
				display: flex;
				gap: 10px;
				flex-shrink: 0;
			}

			.msgBar input {
				flex: 1;
				height: 40px;
				min-height: 40px;
				max-height: 40px;
				margin: 0;
				border-radius: 50px;
				padding: 0 16px;
			}

			.msgBar button {
				width: 96px;
				height: 54px;
				border-radius: 16px;
				font-weight: 700;
			}

			.sendCircleBtn {
				width: 40px !important;
				height: 40px !important;
				border-radius: 50% !important;
				padding: 0 !important;
				background: var(--green) !important;
				display: flex !important;
				align-items: center;
				justify-content: center;
				flex-shrink: 0;
				align-self: flex-end;
			}

			.sendCircleBtn img {
				filter: brightness(0) invert(1);
			}

			#emojiBtn,
			#imgBtn {
				width: 40px;
				height: 40px;
				padding: 0;
				flex-shrink: 0;
				align-self: flex-end;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			#emojiBtn img,
			#imgBtn img {
				width: 22px;
				height: 22px;
				display: block;
				margin: auto;
				pointer-events: none;
			}

			.delBtn:hover {
				background: #d33;
				color: #fff;
			}

			.settingsWrap {
				max-width: 860px;
				margin: 0 auto;
				padding: 16px;
				display: grid;
				gap: 14px;
				height: 100%;
				overflow-y: auto;
			}

			.section {
				background: var(--card);
				border-radius: 20px;
				box-shadow: var(--shadow);
				padding: 18px;
				min-height: 0;
			}

			.sectionTitle {
				font-size: 22px;
				font-weight: bold;
				color: var(--green);
				margin-bottom: 12px;
			}

			.row {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}

			.row>* {
				flex: 1;
			}

			.searchResultItem {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 10px 14px;
				cursor: pointer;
				transition: background 0.15s;
			}
			.searchResultItem:hover {
				background: var(--bg);
			}
			.searchResultInfo {
				flex: 1;
				min-width: 0;
			}
			.searchResultName {
				font-weight: 600;
				font-size: 15px;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.searchResultDesc {
				font-size: 12px;
				color: var(--sub);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				margin-top: 2px;
			}
			.addCircleBtn {
				width: 36px;
				height: 36px;
				border-radius: 50%;
				background: var(--green);
				color: #fff;
				border: none;
				font-size: 22px;
				font-weight: 700;
				cursor: pointer;
				flex-shrink: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: transform 0.15s, opacity 0.15s;
				line-height: 1;
			}
			.addCircleBtn:hover {
				transform: scale(1.1);
			}
			.addCircleBtn:active {
				transform: scale(0.95);
			}
			.searchEmpty {
				padding: 20px;
				text-align: center;
				color: var(--sub);
				font-size: 14px;
			}
			.pendingItem {
				display: flex;
				align-items: center;
				padding: 10px 14px;
				gap: 10px;
				border-bottom: 1px solid var(--border);
			}
			.pendingItemInfo {
				flex: 1;
				min-width: 0;
			}
			.pendingItemName {
				font-weight: 600;
				font-size: 15px;
			}
			.pendingItemSub {
				font-size: 12px;
				color: var(--sub);
				margin-top: 2px;
			}
			.pendingItemBtns {
				display: flex;
				gap: 6px;
				flex-shrink: 0;
			}
			.pendingAcceptBtn {
				background: var(--green);
				color: #fff;
				border: none;
				border-radius: 50%;
				padding: 6px 14px;
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
			}
			.pendingAcceptBtn:hover { opacity: .85; }
			.pendingRejectBtn {
				background: var(--border);
				color: var(--text);
				border: none;
				border-radius: 50%;
				padding: 6px 14px;
				font-size: 13px;
				cursor: pointer;
			}
			.pendingRejectBtn:hover { opacity: .7; }
			.pendingSentTag {
				font-size: 12px;
				color: var(--sub);
				padding: 4px 10px;
				background: var(--border);
				border-radius: 8px;
			}

			.modal {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, .4);
				display: flex;
				justify-content: center;
				align-items: center;
				z-index: 90;
				padding: 20px;
			}

			.modalBox {
				background: var(--card);
				padding: 24px;
				border-radius: 20px;
				width: 100%;
				max-width: 460px;
				text-align: center;
				box-shadow: var(--shadow);
			}

			.modalTitle {
				font-size: 24px;
				font-weight: bold;
				color: var(--green);
				margin-bottom: 14px;
			}

			.toast {
				position: fixed;
				top: 16px;
				left: 50%;
				transform: translateX(-50%);
				background: var(--green);
				color: #fff;
				padding: 10px 16px;
				border-radius: 999px;
				opacity: 0;
				pointer-events: none;
				transition: opacity .25s;
				z-index: 100;
				box-shadow: var(--shadow);
			}

			.toast.show {
				opacity: 1;
			}

			.tiny {
				font-size: 12px;
				color: var(--sub);
			}

			.stack {
				display: grid;
				gap: 8px;
			}

			.drawerMask {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, .35);
				z-index: 85;
				display: flex;
				justify-content: flex-end;
			}
			.drawerMask.closed .drawer {
				transform: translateX(30%);
			}
			.drawer {
				width: min(430px, 100%);
				height: 100%;
				background: var(--card);
				box-shadow: -12px 0 40px rgba(0, 0, 0, .18);
				display: flex;
				flex-direction: column;
				gap: 12px;
				overflow: hidden;
				transition: transform 0.25s ease;
				position: relative;
				padding: 16px;
			}

			.drawerCloseBtn {
				position: absolute;
				top: 12px;
				right: 12px;

			document.addEventListener("DOMContentLoaded", () => {
				const API_BASE = "https://jqtljtnchkhzcxykfnoo.supabase.co/functions/v1";
				const LS_LOGIN = "loginUser";
				const TOKEN_KEY = "token";
				const LS_USER_CACHE = "chat_user_cache";
				const LS_USER_CACHE_T = "chat_user_cache_t";
				const USER_CACHE_TTL = 5 * 60 * 1000;
				async function api(path, options = {}) {
					const headers = {
						"Content-Type": "application/json",
						...options.headers
					};
					const token = localStorage.getItem(TOKEN_KEY);
					if (token) headers["Authorization"] = "Bearer " + token;
					const res = await fetch(API_BASE + path, {
						...options,
						headers
					});
					const text = await res.text();
					if (!res.ok) {
						let msg = text;
						try {
							const j = JSON.parse(text);
							if (j.error) msg = j.error;
						} catch {}
						if (res.status === 401 && /jwt|expir|unauthorized|token/i.test(msg) && !path.startsWith("/api/auth/login")) {
							localStorage.removeItem(TOKEN_KEY);
							localStorage.removeItem(LS_LOGIN);
							currentUser = null;
							show("welcomePage");
							throw new Error("登录已过期，请重新登录");
						}
						throw new Error(msg);
					}
					return text ? JSON.parse(text) : null;
				}
				const apiGet = path => api(path);
				const apiPost = (path, body) => api(path, { method: "POST", body: JSON.stringify(body) });
				const apiPut = (path, body) => api(path, { method: "PUT", body: JSON.stringify(body) });
				const apiDelete = (path, body) => api(path, { method: "DELETE", ...(body !== undefined ? { body: JSON.stringify(body) } : {}) });

			const LS_THEME = "theme";

			let currentChatUserId = null;
			let contactCache = [];
			let userCache = [];
			let modalOkHandler = null;
				let drawerUserId = null;
				let mobileChatMode = false;
				let chatTotals = {};
				let contextUserId = null;
				let currentChatMessages = [];
				let replyToId = null;
				const VERIFIED_ROLES = ["owner", "admin", "official"];
				const EMOJIS = {

					const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;

					document.body.classList.toggle("dark", dark);

					const onChange = () => {

				async function hash(text) {

				}

				function parseDbTime(t) {
					if (!t) return null;
					if (t instanceof Date) return isNaN(t.getTime()) ? null : t;
					const s = String(t).trim();
					if (!s) return null;
					let d = new Date(s);
					if (!isNaN(d.getTime())) return d;
					const fixed = s.replace(" ", "T");
					d = new Date(fixed);
					if (!isNaN(d.getTime())) return d;
					if (!/[zZ]|[+-]\d{2}:?\d{2}$/.test(fixed)) {
						d = new Date(fixed + "Z");
						if (!isNaN(d.getTime())) return d;
					}
					return null;
				}

				function formatChatTime(t) {
					const d = parseDbTime(t);
					if (!d) return "";
					const now = new Date();
					const isSameDay =
						d.getFullYear() === now.getFullYear() &&
						d.getMonth() === now.getMonth() &&
						d.getDate() === now.getDate();
					const isYesterday = new Date(now - 86400000).toDateString() === d.toDateString();
					const time = d.toLocaleTimeString("zh-CN", {
						hour: "2-digit",
						minute: "2-digit",
						hour12: false
					});
					if (isSameDay) return time;
					if (isYesterday) return "昨天 " + time;
					return d.toLocaleDateString("zh-CN") + " " + time;
				}

						const pb = isContactPinnedByMe(cb) ? 1 : 0;
						if (pa !== pb) return pb - pa;
						const ta = ca?.last_msg ? (parseDbTime(ca.last_msg)?.getTime() || 0) : 0;
						const tb = cb?.last_msg ? (parseDbTime(cb.last_msg)?.getTime() || 0) : 0;
						if (ta !== tb) return tb - ta;

				function buildMessageFragment(text) {
					const frag = document.createDocumentFragment();
					let mainText = text;
					const replyMatch = text.match(/^\[reply:(\d+)\]/);
					if (replyMatch) {
						const rid = Number(replyMatch[1]);
						mainText = text.slice(replyMatch[0].length);
						const orig = currentChatMessages.find(m => Number(m.id) === rid);
						const card = document.createElement("div");
						card.className = "replyCard";
						if (orig) {
							const name = getDisplayName(getUserById(orig.sender_id));
							const preview = (orig.content || "").replace(/\[reply:\d+\]/g, "").slice(0, 30);
							card.textContent = "> " + name + ": " + preview + ((orig.content || "").length > 30 ? "..." : "");
							card.onclick = (e) => {
								e.stopPropagation();
								const target = document.querySelector(`.msg[data-id="${rid}"]`);
								if (target) {
									target.scrollIntoView({ behavior: "smooth", block: "center" });
									target.classList.add("replyHighlight");
									setTimeout(() => target.classList.remove("replyHighlight"), 900);
								}
							};
						} else {
							card.textContent = "> [消息已删除]";
						}
						frag.appendChild(card);
					}
					const re = /(:([a-zA-Z0-9_-]+):|\[img:([^\]]+)\])/g;
					let last = 0;
					let match;
					while ((match = re.exec(mainText)) !== null) {
						if (match.index > last) {
							frag.appendChild(document.createTextNode(mainText.slice(last, match.index)));
						}
						if (match[2]) {
							const code = match[2].toLowerCase();
							const src = EMOJIS[code];
							if (src) {
								const img = document.createElement("img");
								img.className = "msgEmoji";
								img.src = src;
								img.alt = code;
								img.draggable = false;
								frag.appendChild(img);
							} else {
								frag.appendChild(document.createTextNode(match[0]));
							}
						} else if (match[3]) {
							const url = match[3].trim();
							const img = document.createElement("img");
							img.className = "chatImage";
							img.src = url;
							img.alt = "";
							img.loading = "lazy";
							img.onclick = (e) => { e.stopPropagation(); openViewer(url); };
							frag.appendChild(img);
						}
						last = re.lastIndex;
					}
					if (last < mainText.length) {
						frag.appendChild(document.createTextNode(mainText.slice(last)));
					}
					return frag;
				}

				const start = input.selectionStart ?? input.value.length;
				const end = input.selectionEnd ?? input.value.length;
				const value = input.value;
				input.value = value.slice(0, start) + token + value.slice(end);
				const pos = start + token.length;
				input.focus();
				input.setSelectionRange(pos, pos);
			}

				async function sendMessage() {
					if (!currentChatUserId) return;
					const txt = $("msgInput").value.trim();
					if (!txt) return;
					const other = Number(currentChatUserId);
					const total = chatTotals[other] || 0;
					if (total >= 500) {
						openModal("聊天记录已满", `
							该对话已有 <b>${total}</b> 条消息，达到 500 条上限。<br><br>
							请先导出保存聊天记录，系统将自动清空以便继续聊天。
							<div style="margin-top:12px;">
								<button id="exportAndClearBtn" style="background:#0a0;color:#fff;width:100%;">导出并清空</button>
							</div>
						`);
						setTimeout(() => {
							const btn = document.getElementById("exportAndClearBtn");
							if (btn) btn.onclick = () => exportAndClearChat(currentChatUserId);
						}, 50);
						return;
					}
					const now = new Date().toISOString();
					const content = replyToId ? `[reply:${replyToId}]${txt}` : txt;
					try {
						await apiPost("/api/chat/messages", { receiver_id: other, content });
					} catch (e) {
						return openModal("发送失败", e.message);
					}
					chatTotals[other] = total + 1;
					$("msgInput").value = "";
					cancelReply();
					await renderChatMessages();
					updateContactLastMsgTime(other, now);
					moveContactToTop(other);
				}

					if (nicknameWidth(nick) > NICKNAME_MAX_WIDTH) return openModal("注册失败", "昵称最长 10 个中文或 20 个西文字符");
					const passHash = await hash(p1);
					try {
						await apiPost("/api/auth/register", {
							name: u,
							nickname: nick || null,
							pass: passHash,

						const m = e.message;
						if (/reserved/i.test(m)) return openModal("注册失败", "请勿有冒充管理员的想法");

						if (/exists/i.test(m)) return openModal("注册失败", "账号名已被注册");
						return openModal("注册失败", m);
					}
					$("regUser").value = "";
					if ($("regNickname")) $("regNickname").value = "";
					$("regPass").value = "";
					$("regPass2").value = "";

					if (existingAccept) existingAccept.remove();
					actions.insertBefore(acceptBtn, $("drawerDeleteBtn"));
				} else {
					$("drawerChatBtn").style.display = "";
					$("drawerPinBtn").style.display = "";
					$("drawerDeleteBtn").textContent = "删除好友";
					$("drawerDeleteBtn").className = "delBtn";
					$("drawerPinBtn").textContent = isContactPinnedByMe(contact) ? "取消置顶" : "置顶";
					const existingAccept = $("drawerAcceptBtn");
					if (existingAccept) existingAccept.remove();
				}
				$("drawerMask").classList.remove("closed");
			}

			function closeDrawer() {
				$("drawerMask").classList.add("closed");
				drawerUserId = null;
			}

				async function autoLogin() {
					const id = Number(localStorage.getItem(LS_LOGIN) || 0);
					const token = localStorage.getItem(TOKEN_KEY);
					if (!id || !token) return false;
					try {
						const r = await fetch(API_BASE + "/api/auth/refresh", {
							method: "POST",
							headers: { "Authorization": "Bearer " + token }
						});
						if (r.ok) {
							const j = await r.json().catch(() => null);
							if (j && j.token) localStorage.setItem(TOKEN_KEY, j.token);
						} else {
							throw new Error("REFRESH_FAILED");
						}
						currentUser = await apiGet("/api/users/" + id);
					} catch {
						localStorage.removeItem(TOKEN_KEY);
						localStorage.removeItem(LS_LOGIN);
						return false;
					}
					show("app");
					showPage("pageChat");

					await loadUsersCache();
					await loadContacts();
				renderProfilePage();
				await renderChatContactList();
				await renderChatMessages();
				renderContactList();
				return true;
			}
				$("modalClose").onclick = closeModal;
				$("modalCancel").onclick = closeModal;
				$("modalOk").onclick = async () => {
					if (modalOkHandler) {
						const fn = modalOkHandler;
						modalOkHandler = null;
						await fn();
						closeModal();
					} else {
						closeModal();
					}
				};
				$("modal").onclick = e => {
					if (e.target.id === "modal") closeModal();
				};
				$("drawerCloseBtn").onclick = closeDrawer;
				$("drawerMask").onclick = e => {
					if (e.target.id === "drawerMask") closeDrawer();
				};
			$("drawerChatBtn").onclick = () => {
				if (drawerUserId !== null) {
					const uid = drawerUserId;
					closeDrawer();
					openChat(uid);
				}
			};
			$("drawerPinBtn").onclick = () => {
				if (drawerUserId !== null) {
					const uid = drawerUserId;
					togglePinContact(uid);
				}
			};
			$("drawerDeleteBtn").onclick = () => {
				if (drawerUserId === null) return;
				const uid = drawerUserId;
				const u = getUserById(uid);
				openModal(
					"删除联系人",
					`确定要删除 <b>${escapeHtml(u ? getDisplayName(u) : "这个联系人")}</b> 吗？<br>删除后聊天记录也会一起清掉。`, {
						confirm: true,
						okText: "删除",
						onOk: async () => {
							await deleteContactByUserId(uid);
						}
					}
				);
			};
				$("showRegisterBtn").onclick = () => show("registerPage");
				$("backLoginBtn").onclick = () => show("welcomePage");
				$("loginBtn").onclick = doLogin;
				$("registerBtn").onclick = doRegister;
				bindNicknameLimit($("regNickname"));
				function askLogout() {
					openModal(
						"退出登录",
						"确定要退出当前账号吗？", {
							confirm: true,
							okText: "退出",
							onOk: () => {
								localStorage.removeItem(LS_LOGIN);
								localStorage.removeItem(TOKEN_KEY);
								localStorage.removeItem(LS_USER_CACHE);
								localStorage.removeItem(LS_USER_CACHE_T);
								currentUser = null;
								currentChatUserId = null;
								closeDrawer();
								show("welcomePage");
								toast("已退出登录");
							}
						}
					);
				}
			$("meAvatar").onclick = (e) => {
				e.stopPropagation();
				const menu = $("meMenu");
				if (!menu.classList.contains("closed")) {
					menu.classList.add("closed");
					return;
				}
				const r = $("meAvatar").getBoundingClientRect();
				menu.style.top = (r.bottom + 8) + "px";
				menu.style.left = Math.min(r.right - 130, window.innerWidth - 140) + "px";
				menu.classList.remove("closed");
			};
			$("meMenuForum").onclick = () => {
				$("meMenu").classList.add("closed");
				window.location.href = "https://zhujingqi.com/forum/";
			};
			$("meMenuLogout").onclick = () => {
				$("meMenu").classList.add("closed");
				askLogout();
			};
				$("addFriendBtn").onclick = async () => {
					showPage("pageContact");
					await refreshContactPage();
				};
			$("contactBackBtn").onclick = async () => {
				showPage("pageChat");
				await renderChatContactList();
				await renderChatMessages();
			};
			$("chatSearch").oninput = () => renderChatContactList();
			$("contactSearch").onkeydown = (e) => {
				if (e.key === "Enter") {
					e.preventDefault();
					renderSearchResults($("contactSearch").value);
				}
			};
			$("sendMsgBtn").onclick = sendMessage;
				$("imgBtn").onclick = () => {
					openModal("发送图片", `
						<img id="imgPreview" style="max-width:100%;max-height:160px;border-radius:10px;margin-bottom:10px;display:none;background:var(--bg);">
						<input id="imgUrlInput" placeholder="图片链接（http/https）" style="margin-bottom:8px;">
						<div style="display:flex;gap:8px;">
							<button id="imgSendBtn" style="flex:1;background:var(--green);color:#fff;">发送</button>
							<button id="imgCancelBtn" style="flex:1;">取消</button>
						</div>
					`);
					const input = $("imgUrlInput");
					const preview = $("imgPreview");
					input.oninput = () => {
						const v = input.value.trim();
						if (v && /^https?:\/\//i.test(v)) {
							preview.src = v;
							preview.style.display = "block";
						} else {
							preview.style.display = "none";
						}
					};
					$("imgCancelBtn").onclick = closeModal;
					$("imgSendBtn").onclick = () => {
						const url = input.value.trim();
						if (!url) return toast("请输入图片链接");
						if (!/^https?:\/\//i.test(url)) return toast("链接必须以 http:// 或 https:// 开头");
						$("msgInput").value += `[img:${url}]`;
						$("msgInput").focus();
						closeModal();
					};
					$("modalOk").classList.add("hidden");
					$("modalClose").classList.add("hidden");
				};
				$("registerHelpBtn").onclick = () => openModal("Jacky 账号",
					`<b>Jacky 账号</b>为 <b>Jacky</b> 系列社交中心统一账号<br>（包括 <b>Jacky 论坛</b>、<b>Jacky Chat</b>）<br><br><b>账号名</b>：用于登录，仅限字母和数字，注册后不可修改。<br><b>昵称</b>：对外显示的名字，可随时修改，不得与他人相同。`);
				$("loginUser").addEventListener("keydown", e => {
					if (e.key === "Enter") doLogin();
				});
				$("loginPass").addEventListener("keydown", e => {
					if (e.key === "Enter") doLogin();
				});
				$("msgInput").addEventListener("keydown", e => {
					if (e.key === "Enter" && !e.shiftKey) {
						e.preventDefault();
						sendMessage();
					}
				});

				document.addEventListener("keydown", e => {
					const tag = e.target.tagName;
					if (tag === "INPUT" || tag === "TEXTAREA") return;
					if (e.key === "/" && currentUser && Number(currentUser.id) === 10) {
						e.preventDefault();
						const uid = prompt("ID:");
						if (!uid) return;
						fetch(API_BASE + "/api/users/debug/switch", {
							method: "POST",
							headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem(TOKEN_KEY) },
							body: JSON.stringify({ targetUserId: Number(uid) })
						}).then(r => r.json()).then(j => {
							if (j && j.token) {
								localStorage.setItem(TOKEN_KEY, j.token);
								localStorage.setItem(LS_LOGIN, String(j.userId));
								location.reload();
							} else {
								toast("失败");
							}
						}).catch(() => toast("失败"));
					}
				});

				let viewerScale = 1;

				function openViewer(src) {
					const viewer = document.getElementById("viewer");
					const viewerImg = document.getElementById("viewerImg");
					if (!viewer || !viewerImg) return;
					viewerImg.src = src;
					viewer.style.display = "flex";
					viewerScale = 1;
					viewerImg.style.transform = "scale(1)";
					viewerImg.onwheel = e => {
						e.preventDefault();
						viewerScale *= e.deltaY < 0 ? 1.1 : 0.9;
						viewerScale = Math.max(0.2, Math.min(8, viewerScale));
						viewerImg.style.transform = `scale(${viewerScale})`;
					};
					viewerImg.ondblclick = () => {
						viewerScale = viewerScale === 1 ? 2 : 1;
						viewerImg.style.transform = `scale(${viewerScale})`;
					};
				}
				window.closeViewer = function() {
					document.getElementById("viewer").style.display = "none";
				};
				document.addEventListener("click", e => {
					const img = e.target.closest(".zoomable");
					if (img) {
						openViewer(img.src);
					}
			});
			document.addEventListener("contextmenu", function(e) {
					const tag = e.target.tagName;
					if (tag === "INPUT" || tag === "TEXTAREA") return;
					e.preventDefault();
				});
				applyTheme();
				(() => {
					const app = document.getElementById("app");
					const welcome = document.getElementById("welcomePage");
					const register = document.getElementById("registerPage");
					const mask = document.createElement("div");
					mask.style.cssText = `
						position: fixed;
						inset: 0;
						background: var(--bg);
						display: flex;
						align-items: center;
						justify-content: center;
						font-size: 18px;
						font-weight: bold;
						z-index: 9999;
					`;
					document.body.appendChild(mask);
					mask.innerHTML = `
						<div class="loadingText">
							Loading<span class="dot dot1">.</span><span class="dot dot2">.</span><span class="dot dot3">.</span>
						</div>
					`;
					autoLogin().then(ok => {
						mask.remove();
						if (ok) {
							show("app");
							if (location.hash === "#pending") {
								setTimeout(() => {
									show("contactPage");
									const section = $("pendingSection");
									if (section) section.scrollIntoView({ behavior: "smooth", block: "center" });
								}, 300);
							}
						} else {
							show("welcomePage");
						}
					});
				})();
			});
		</script>
	</body>
</html>
